name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build APK and publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools-version: '36.0.0'

      - name: Install Node dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor android
        run: npx cap copy android

      - name: Build debug APK
        working-directory: android
        run: |
          # gradlew 在 Windows 提交时可能丢失可执行位，先确保有执行权限
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Read version
        id: version
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" "platform-solo-sutra-v${{ steps.version.outputs.version }}.apk"
          ls -la *.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: platform-solo-sutra-apk
          path: platform-solo-sutra-*.apk
          retention-days: 7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ steps.version.outputs.sha }}
          name: TanJing v${{ steps.version.outputs.version }} (${{ steps.version.outputs.sha }})
          body: |
            自动构建于 main 分支更新。

            请下载 APK 手动安装。
          files: platform-solo-sutra-*.apk
          generate_release_notes: true
