<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="六祖坛经·阅藏 — 经折装数字阅读器。阅读，即是修行。">
  <meta name="theme-color" content="#F3EFE0">
  <title>六祖壇經 · 閱藏</title>

  <!-- 霞鹜文楷 (本地 woff2 子集) -->
  <link rel="stylesheet" href="fonts/font.css">
  <!-- 虎皮宣配色 · 经折装布局 -->
  <link rel="stylesheet" href="css/sutra.css">
</head>
<body>

  <!-- 顶栏 -->
  <header class="topbar">
    <button id="side-handle" class="side-handle" aria-label="打开目錄" hidden></button>
    <div class="topbar-title">六祖壇經</div>
    
    <nav class="topbar-nav">
      <button id="compare-btn" class="topbar-btn" aria-label="對照" title="敦煌本對照" hidden>對照</button>
      <button id="pinyin-btn" class="topbar-btn" aria-label="注音" title="拼音注音">注音</button>
      <button id="search-btn" class="topbar-btn" aria-label="搜索">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </button>
      <button id="top-search-settings" class="topbar-btn" aria-label="设置">⚙</button>
      <select id="chapter-select" aria-label="品名导航">
        <option value="">— 選品 —</option>
      </select>
      <span class="topbar-progress">0%</span>
    </nav>
  </header>

  <!-- 搜索面板 -->
  <div id="search-panel" class="search-panel" hidden>
    <div class="search-input-row">
      <input id="search-input" type="text" placeholder="搜經文…" autocomplete="off">
      <button id="search-settings-btn" class="topbar-btn" aria-label="设置">⚙</button>
      <span id="search-count" class="search-count"></span>
      <button id="search-close" class="topbar-btn" aria-label="关闭">✕</button>
    </div>
    <ul id="search-results" class="search-results"></ul>
  </div>

  <!-- 经折装横滚容器 -->
  <main class="scroll-container">
    <div class="loading">展卷中…</div>
  </main>

  <!-- 侧边面板：移动端目录切换与搜索 -->
  <aside id="side-panel" class="side-panel" hidden>
    <div class="side-panel-header">
      <div class="side-panel-title">目錄 & 搜索</div>
      <button id="side-panel-close" class="topbar-btn" aria-label="关闭">✕</button>
    </div>
    <div class="side-panel-body">
      <div class="mobile-search-row">
        <input id="mobile-search-input" type="text" placeholder="搜經文…" autocomplete="off">
        <div id="mobile-search-count" class="search-count"></div>
      </div>

      <div class="mobile-chapter-section">
        <div class="mobile-chapter-heading">目錄</div>
        <ul id="mobile-chapter-list" class="mobile-chapter-list">
          <!-- populated dynamically -->
        </ul>
      </div>

      <ul id="mobile-search-results" class="search-results"></ul>
    </div>
  </aside>

  <!-- 当侧边面板打开时覆盖主页面以拦截触摸/点击 -->
  <div id="panel-overlay" class="panel-overlay" hidden></div>
  <!-- 左侧可见把手（移动端），用于可靠打开侧栏，避免误触中间区域 -->
  <div id="side-handle" class="side-handle" aria-label="打开目錄" hidden></div>

  <!-- 底部进度条 -->
  <div class="progress-bar">
    <div class="progress-bar-fill"></div>
  </div>

  <!-- 设置面板（字体大小、行距） -->
  <aside id="settings-panel" class="settings-panel" hidden>
    <div class="settings-header">
      <button id="settings-back" class="topbar-btn" aria-label="返回">←</button>
      <div class="settings-title">顯示設定</div>
    </div>
    <div class="settings-body">
      <div class="setting-row">
        <label>顯示模式</label>
        <div class="setting-control">
          <select id="display-mode-select">
            <option value="scroll">滑動顯示</option>
            <option value="paged">翻頁顯示</option>
          </select>
        </div>
      </div>
      <div class="setting-row">
        <label>字體</label>
        <div class="setting-control">
          <select id="font-select">
            <option value="'LXGW WenKai', 'Kaiti SC', 'KaiTi', 'STKaiti', serif">霞鹜文楷（預設）</option>
            <option value="'Noto Serif TC', serif">Noto Serif TC</option>
            <option value="'PingFang TC', 'Helvetica Neue', Arial, sans-serif">PingFang / 系统</option>
            <option value="'PMingLiU', 'Times New Roman', serif">細明體</option>
          </select>
        </div>
      </div>
      <div class="setting-row">
        <label>字體大小</label>
        <div class="setting-control">
          <button id="font-size-decr" class="small-btn">−</button>
          <input id="font-size-range" type="range" min="12" max="28" step="1">
          <button id="font-size-incr" class="small-btn">＋</button>
          <span id="font-size-value" class="setting-value"></span>
        </div>
      </div>
      <div class="setting-row">
        <label>字體行距</label>
        <div class="setting-control">
          <button id="line-height-decr" class="small-btn">−</button>
          <input id="line-height-range" type="range" min="1" max="2.6" step="0.05">
          <button id="line-height-incr" class="small-btn">＋</button>
          <span id="line-height-value" class="setting-value"></span>
        </div>
      </div>
      <div class="setting-actions">
        <button id="settings-reset" class="topbar-btn">恢復預設</button>
      </div>
      <div class="setting-row">
        <label>對照模式</label>
        <div class="setting-control">
          <label class="checkbox-label"><input id="setting-compare-mode" type="checkbox"> 啟用對照（敦煌本 vs 宗寶本）</label>
        </div>
      </div>
    </div>
  </aside>
  <!-- 核心逻辑 -->
  <script src="js/main.js"></script>
</body>
</html>
