<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="六祖坛经·阅藏 — 经折装数字阅读器。阅读，即是修行。">
  <meta name="theme-color" content="#F3EFE0">
  <title>六祖坛经 · 阅藏</title>

  <!-- 霞鹜文楷 (本地 woff2 子集) -->
  <link rel="stylesheet" href="fonts/font.css">
  <!-- 虎皮宣配色 · 经折装布局 -->
  <link rel="stylesheet" href="css/sutra.css">
  <link rel="stylesheet" href="css/highlight.css">
  <link rel="stylesheet" href="css/selection-toolbar.css">
  <link rel="stylesheet" href="css/notes.css">
</head>
<body>

  <!-- 顶栏 -->
  <header class="topbar">
    <div class="topbar-main">
      <button id="side-handle" class="side-handle" aria-label="打开目录" hidden></button>
      <div class="topbar-title" id="topbar-title">六祖坛经</div>
      <!-- 隐藏的触发按钮（供菜单点击） -->
      <button id="search-btn" hidden></button>
      <button id="read-btn" hidden></button>
      <button id="annotations-top-btn" hidden>
        <!-- 原朗读 SVG: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/><path d="M8 21h8"/></svg> -->
        <!-- 原标注 SVG: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg> -->
      </button>
      <nav class="topbar-nav">
        <button id="quote-btn" class="topbar-btn" aria-label="每日一语" title="每日一语">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="8" width="18" height="12" rx="2"/>
            <path d="M3 8h18"/>
            <path d="M12 8v12"/>
            <path d="M7 3l5 5 5-5"/>
          </svg>
        </button>
        <button id="notes-top-btn" class="topbar-btn" aria-label="笔记" title="我的笔记">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
        </button>
        <div class="actions-menu">
          <button id="actions-menu-btn" class="topbar-btn actions-btn" aria-label="操作" title="操作" aria-haspopup="menu" aria-expanded="false">⚙</button>
          <div id="actions-menu-panel" class="actions-menu-panel" role="menu" hidden>
            <button id="menu-search-btn" class="topbar-btn actions-menu-item" aria-label="搜索" role="menuitem">搜索</button>
            <button id="menu-read-btn" class="topbar-btn actions-menu-item" aria-label="朗读" role="menuitem">朗读</button>
            <button id="annotations-btn" class="topbar-btn actions-menu-item" aria-label="我的标注" title="我的标注" role="menuitem">标注</button>
            <button id="compare-btn" class="topbar-btn actions-menu-item" aria-label="对照" title="敦煌本对照" role="menuitem">对照</button>
            <button id="pinyin-btn" class="topbar-btn actions-menu-item" aria-label="注音" title="拼音注音" role="menuitem">注音</button>
            <!-- <button id="download-zongbao-btn" class="topbar-btn actions-menu-item" aria-label="下载宗宝本" title="下载宗宝本" role="menuitem">下载宗宝本</button> -->
            <button id="top-search-settings" class="topbar-btn actions-menu-item" aria-label="设置" title="设置" role="menuitem">⚙ 设置</button>
          </div>
        </div>
        <select id="chapter-select" aria-label="品名导航">
          <option value="">— 选品 —</option>
        </select>
        <span class="topbar-progress">0%</span>
      </nav>
      <!-- 搜索展开行（激活时替换标题和导航） -->
      <div id="topbar-search-row" class="topbar-search-row" hidden>
        <input id="search-input" type="text" placeholder="搜经文…" autocomplete="off">
        <span id="search-count" class="search-count"></span>
        <button id="search-close" class="topbar-btn" aria-label="关闭">✕</button>
      </div>
    </div>
    <!-- 搜索结果（顶栏内向下展开） -->
    <div id="search-panel" class="search-panel" hidden>
      <ul id="search-results" class="search-results"></ul>
    </div>
  </header>

  <!-- 经折装横滚容器 -->
  <main class="scroll-container">
    <div class="loading">展卷中…</div>
  </main>

  <!-- 侧边面板：移动端目录切换与搜索 -->
  <aside id="side-panel" class="side-panel" hidden>
    <div class="side-panel-header">
    <div class="side-panel-title">目录 & 搜索</div>
      <button id="side-panel-close" class="topbar-btn" aria-label="关闭">✕</button>
    </div>
    <div class="side-panel-body">
      <div class="mobile-search-row">
        <input id="mobile-search-input" type="text" placeholder="搜经文…" autocomplete="off">
        <div id="mobile-search-count" class="search-count"></div>
      </div>

      <div class="mobile-chapter-section">
        <div class="mobile-chapter-heading">目录</div>
        <ul id="mobile-chapter-list" class="mobile-chapter-list">
          <!-- populated dynamically -->
        </ul>
      </div>

      <ul id="mobile-search-results" class="search-results"></ul>
    </div>
  </aside>

  <!-- 朗读控制条 -->
  <div id="reader-bar" class="reader-bar" hidden>
    <div class="reader-progress-wrap">
      <div id="reader-progress" class="reader-progress">
        <div id="reader-progress-fill" class="reader-progress-fill"></div>
      </div>
      <span id="reader-progress-label" class="reader-progress-label">0/0</span>
    </div>
    <div class="reader-controls">
      <button id="reader-close" class="reader-btn" title="关闭">✕</button>
      <span id="reader-status" class="reader-status">已就绪</span>
      <button id="reader-prev" class="reader-btn" title="上一句">⏮</button>
      <button id="reader-play" class="reader-btn reader-play" title="播放/暂停">▶</button>
      <button id="reader-next" class="reader-btn" title="下一句">⏭</button>
      <label class="reader-speed-label">语速</label>
      <select id="reader-speed" class="reader-speed">
        <option value="0.5">0.5x</option>
        <option value="0.75" selected>0.75x</option>
        <option value="1">1x</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
        <option value="2">2x</option>
      </select>
    </div>
  </div>

  <!-- 每日一语弹窗 -->
  <div id="quote-overlay" class="panel-overlay" hidden></div>
  <aside id="quote-card" class="quote-card" hidden>
    <button id="quote-close" class="topbar-btn" aria-label="关闭" style="position:absolute;top:0.5rem;right:0.5rem;z-index:1;">✕</button>
    <div class="quote-card-content">
      <div id="quote-date" class="quote-date"></div>
      <div id="quote-text" class="quote-text"></div>
      <div id="quote-annotation" class="quote-annotation"></div>
      <div id="quote-source" class="quote-source"></div>
    </div>
    <button id="quote-next" class="topbar-btn" style="width:100%;justify-content:center;padding:0.6rem;border-top:1px solid var(--paper-edge);border-radius:0 0 12px 12px;">换一句 →</button>
  </aside>

  <!-- 当侧边面板打开时覆盖主页面以拦截触摸/点击 -->
  <div id="panel-overlay" class="panel-overlay" hidden></div>

  <!-- 底部进度条 -->
  <div class="progress-bar">
    <div class="progress-bar-fill"></div>
  </div>

  <!-- 设置面板 -->
  <aside id="settings-panel" class="settings-panel" hidden>
    <div class="settings-header">
      <button id="settings-back" class="topbar-btn" aria-label="返回">←</button>
      <div class="settings-title">设置</div>
      <button id="settings-reset" class="topbar-btn" style="margin-left:auto;">恢复默认</button>
    </div>
    <div class="settings-body">

      <!-- 书籍切换 -->
      <div class="setting-section-label">典籍</div>
      <div class="setting-row">
        <label>当前典籍</label>
        <div class="setting-control">
          <select id="book-select" class="setting-select">
            <option value="tanjing">六祖坛经</option>
            <option value="wumenguan">无门关</option>
            <option value="wenmingzhiguang">文明之光</option>
          </select>
        </div>
      </div>

      <div class="setting-section-label">阅读</div>
      <div class="setting-row">
        <label>显示模式</label>
        <div class="setting-control">
          <select id="display-mode-select" class="setting-select">
            <option value="scroll">滑动显示</option>
            <option value="paged">翻页显示</option>
          </select>
        </div>
      </div>
      <div class="setting-row">
        <label>字体</label>
        <div class="setting-control">
          <select id="font-select" class="setting-select">
            <option value="'LXGW WenKai', 'Kaiti SC', 'KaiTi', 'STKaiti', serif">霞鹜文楷（预设）</option>
            <option value="'Noto Serif SC', serif">Noto Serif SC</option>
            <option value="'PingFang SC', 'Helvetica Neue', Arial, sans-serif">PingFang / 系统</option>
            <option value="'PMingLiU', 'Times New Roman', serif">细明体</option>
          </select>
        </div>
      </div>
      <div class="setting-row">
        <label>字体大小</label>
        <div class="setting-control">
          <button id="font-size-decr" class="small-btn">−</button>
          <input id="font-size-range" type="range" min="12" max="28" step="1">
          <button id="font-size-incr" class="small-btn">＋</button>
          <span id="font-size-value" class="setting-value"></span>
        </div>
      </div>
      <div class="setting-row">
        <label>字体行距</label>
        <div class="setting-control">
          <button id="line-height-decr" class="small-btn">−</button>
          <input id="line-height-range" type="range" min="1" max="2.6" step="0.05">
          <button id="line-height-incr" class="small-btn">＋</button>
          <span id="line-height-value" class="setting-value"></span>
        </div>
      </div>

      <div class="setting-section-label">功能</div>
      <div class="setting-row">
        <label>对照模式</label>
        <div class="setting-control">
          <label class="checkbox-label"><input id="setting-compare-mode" type="checkbox"> 启用对照（敦煌本 vs 宗宝本）</label>
        </div>
      </div>
      <div class="setting-row">
        <label>界面语言</label>
        <div class="setting-control">
          <label class="checkbox-label"><input id="setting-traditional-mode" type="checkbox"> 使用繁体（界面与经文）</label>
        </div>
      </div>
    </div>
  </aside>
  <!-- 我的标注面板（整合高亮+笔记+书签） -->
  <aside id="annotations-panel" class="settings-panel" hidden>
    <div class="settings-header">
      <button id="annotations-back" class="topbar-btn" aria-label="返回">←</button>
      <div class="settings-title">我的标注</div>
    </div>
    <div class="settings-body" style="padding:0;">
      <div class="anno-tabs">
        <button id="anno-tab-bookmark" class="anno-tab active">书签</button>
      </div>
      <div id="annotations-list" class="annotations-list"></div>
      <div id="annotations-empty" style="display:none;color:var(--ink-light);text-align:center;padding:1rem;">暂无内容。</div>
    </div>
  </aside>

  <!-- 笔记面板 -->
  <aside id="notes-panel" class="settings-panel" hidden>
    <div class="settings-header">
      <button id="notes-back" class="topbar-btn" aria-label="返回">←</button>
      <div class="settings-title">我的笔记</div>
      <div style="margin-left:auto;display:flex;gap:0.4rem;">
        <button id="notes-export-btn" class="topbar-btn">导出</button>
      </div>
    </div>
    <div class="settings-body">
      <div id="notes-empty" style="color:var(--ink-light);">暂无笔记。</div>
      <ul id="notes-list" class="notes-list"></ul>
    </div>
  </aside>

  <!-- 查词/查字信息面板 -->
  <aside id="lookup-panel" class="settings-panel" hidden>
    <div class="settings-header">
      <button id="lookup-back" class="topbar-btn" aria-label="返回">←</button>
      <div class="settings-title" id="lookup-title">查词</div>
      <div style="margin-left:auto;">
        <a id="lookup-external-link" href="#" target="_blank" rel="noopener" class="topbar-btn" style="text-decoration:none;font-size:0.8rem;">完整解释 ↗</a>
      </div>
    </div>
    <div class="settings-body">
      <div id="lookup-content">
        <div style="display:flex;align-items:center;justify-content:center;gap:0.5rem;padding:0.5rem 0;">
          <div id="lookup-char" style="font-size:2.5rem;color:var(--accent-gold);"></div>
          <button id="lookup-speak" class="topbar-btn" title="朗读" style="font-size:1.2rem;">🔊</button>
        </div>
        <div id="lookup-pinyin" style="text-align:center;font-size:1rem;color:var(--ink-light);padding:0.2rem 0 0.5rem;"></div>
        <div id="lookup-meaning" style="line-height:1.8;font-size:0.95rem;color:var(--ink-main);padding:0.5rem 0;border-top:1px solid rgba(216,200,176,0.3);"></div>
        <div id="lookup-glossary" style="line-height:1.8;font-size:0.9rem;color:var(--ink-light);padding:0.5rem 0;"></div>
        <div id="lookup-not-found" style="display:none;color:var(--ink-light);text-align:center;padding:1rem 0;font-size:0.9rem;"></div>
      </div>
    </div>
  </aside>
  <!-- 核心逻辑 -->
  <!-- 主入口 -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
